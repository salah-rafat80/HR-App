name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main, master, feat/appraisal-backend-migration ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Monorepo Dependencies
        run: |
          cd packages/hr_core
          flutter pub get
          cd ../../apps/web
          flutter pub get

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web App
        run: |
          cd apps/web
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/" --dart-define=API_BASE_URL=https://hr-crm-backend.up.railway.app

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
