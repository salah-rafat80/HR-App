name: CI Pipeline - HR Application

on:
  push:
    branches: [ feat/appraisal-backend-migration ]
  pull_request:
    branches: [ feat/appraisal-backend-migration ]

jobs:
  backend-ci:
    name: Backend CI (Build, Test, Blocking Changed-Files Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Blocking Changed-Files Lint Gate
        run: npm run lint:changed ${{ github.event.before }}..${{ github.sha }} || npm run lint:changed HEAD~1..HEAD

      - name: Report Legacy Baseline Lint (Non-blocking warning)
        run: npm run lint:check || true
