name: CI Pipeline - HR Application

on:
  push:
    branches: [ feat/appraisal-backend-migration ]
  pull_request:
    branches: [ feat/appraisal-backend-migration ]

jobs:
  backend-ci:
    name: Backend CI (Build, Test, Lint Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Run Unit Tests
        run: npm run test

      - name: Check ESLint Baseline (Non-blocking warning)
        run: npm run lint:check || true
